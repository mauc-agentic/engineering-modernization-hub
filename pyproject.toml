[project]
name = "emh"
version = "0.1.0"
description = "Engineering Modernization Hub - prototipo AIUP (caso Wenia)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0",
    "boto3>=1.35",
    "PyYAML>=6.0",
    "docker>=7.1",
    "certifi>=2024.8",
    "pip>=24",  # necesario en el host para `pip download` del wheelhouse (ADR-005/D-6);
                # los venvs de `uv` no lo traen por defecto
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "import-linter>=2.1",
    "ruff>=0.7",
    "opentelemetry-sdk>=1.27",
]
postgres = ["psycopg[binary]>=3.2"]
observabilidad = ["aws-opentelemetry-distro>=0.18.0"]  # ADOT: telemetría a CloudWatch / AgentCore Observability

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["emh"]

[tool.pytest.ini_options]
markers = [
    "simulated: nivel A, ScriptedModel, determinista (SIMULATED)",
    "live: nivel B, modelo real (Bedrock/Nova 2 Lite), requiere credenciales AWS",
]
testpaths = ["tests"]

[tool.importlinter]
root_package = "emh"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "El nucleo no depende de nadie (NFR-015, NFR-016)"
type = "forbidden"
source_modules = ["emh.core"]
forbidden_modules = [
    "emh.policy", "emh.harness", "emh.agent", "emh.strategies",
    "emh.models", "emh.execution", "emh.persistence", "emh.reporting", "emh.api",
    "boto3", "docker", "sqlite3", "fastapi", "langgraph",
]

[[tool.importlinter.contracts]]
name = "Las estrategias no importan agente/harness/politica (03-arquitectura #5)"
type = "forbidden"
source_modules = ["emh.strategies"]
forbidden_modules = ["emh.agent", "emh.harness", "emh.policy"]

[[tool.importlinter.contracts]]
name = "Las capas apuntan hacia el nucleo (layers)"
type = "layers"
layers = [
    "emh.api",
    "emh.agent",
    "emh.harness",
    "emh.policy",
    "emh.core",
]

[tool.ruff]
target-version = "py311"
line-length = 140
extend-exclude = ["infra"]

[tool.ruff.lint]
# E/F = errores; I = imports; UP = sintaxis moderna; B = bugs probables; S = seguridad (Bandit).
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# En pruebas: assert es el mecanismo, y hay secretos/credenciales de mentira a propósito
# (para verificar que la redacción los oculta).
"tests/**" = ["S101", "S105", "S106", "S108", "S110", "S603", "S607"]
# `/tmp` es el tmpfs del sandbox (el venv efímero de la verificación), no un archivo temporal del host.
"emh/strategies/python_dependency_upgrade.py" = ["S108"]
"emh/execution/docker_sandbox.py" = ["S108"]
"sandbox/entrypoint.py" = ["S108", "S603"]
# subprocess SIN shell y con lista de argumentos ya validada por la política (allowlist, control 2).
"emh/execution/wheelhouse.py" = ["S603"]
"emh/harness/tools.py" = ["S603"]
